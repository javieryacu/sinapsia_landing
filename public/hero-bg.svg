<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ultra-light luminous car door paint gradient -->
    <linearGradient id="lightCarBodyPaint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="40%" stopColor="#fafbfc" />
      <stop offset="80%" stopColor="#f5f6f8" />
      <stop offset="100%" stopColor="#fafbfc" />
    </linearGradient>

    <!-- Center bright specular lighting -->
    <radialGradient id="brightReflection" cx="50%" cy="35%" r="70%" fx="50%" fy="25%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.95" />
      <stop offset="60%" stopColor="#fafbfc" stopOpacity="0.6" />
      <stop offset="100%" stopColor="#f2f4f7" stopOpacity="0.5" />
    </radialGradient>

    <!-- Delicate yellow laser line gradient -->
    <linearGradient id="yellowLineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#f4b400" stopOpacity="0" />
      <stop offset="20%" stopColor="#f4b400" stopOpacity="0.6" />
      <stop offset="50%" stopColor="#f4b400" stopOpacity="0.8" />
      <stop offset="80%" stopColor="#f4b400" stopOpacity="0.6" />
      <stop offset="100%" stopColor="#f4b400" stopOpacity="0" />
    </linearGradient>

    <!-- Delicate vertical line gradient -->
    <linearGradient id="yellowLineVertical" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#f4b400" stopOpacity="0" />
      <stop offset="30%" stopColor="#f4b400" stopOpacity="0.4" />
      <stop offset="70%" stopColor="#f4b400" stopOpacity="0.5" />
      <stop offset="100%" stopColor="#f4b400" stopOpacity="0" />
    </linearGradient>

    <!-- Minimal Micro Tech Grid -->
    <pattern id="lightTechGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#09090b" stroke-width="0.5" stroke-opacity="0.025" />
      <circle cx="48" cy="0" r="0.8" fill="#f4b400" fill-opacity="0.2" />
    </pattern>
  </defs>

  <!-- Base Luminous White Car Door Layer -->
  <rect width="1920" height="1080" fill="url(#lightCarBodyPaint)" />
  <rect width="1920" height="1080" fill="url(#brightReflection)" />
  <rect width="1920" height="1080" fill="url(#lightTechGrid)" />

  <!-- Delicate Yellow Technical Accent Lines -->
  <g opacity="0.85">
    <!-- Top horizon line -->
    <line x1="150" y1="160" x2="1770" y2="160" stroke="url(#yellowLineGlow)" stroke-width="1.2" />
    <circle cx="320" cy="160" r="2.5" fill="#f4b400" />
    <circle cx="960" cy="160" r="2" fill="#f4b400" />
    <circle cx="1600" cy="160" r="2.5" fill="#f4b400" />

    <!-- Circuit trace 1 - Top Right -->
    <path d="M 1720 110 L 1420 110 L 1350 180 L 1100 180" fill="none" stroke="url(#yellowLineGlow)" stroke-width="1" stroke-dasharray="6 4" />
    <circle cx="1350" cy="180" r="2" fill="#f4b400" />
    <circle cx="1100" cy="180" r="2.5" fill="#f4b400" />

    <!-- Circuit trace 2 - Left Side -->
    <path d="M 200 360 L 340 360 L 390 410 L 500 410" fill="none" stroke="url(#yellowLineGlow)" stroke-width="1" />
    <circle cx="340" cy="360" r="2.5" fill="#f4b400" />
    <circle cx="500" cy="410" r="2.5" fill="#f4b400" />

    <!-- Circuit trace 3 - Right Side -->
    <path d="M 1420 640 L 1560 640 L 1620 700 L 1750 700" fill="none" stroke="url(#yellowLineGlow)" stroke-width="1" />
    <circle cx="1420" cy="640" r="2.5" fill="#f4b400" />
    <circle cx="1620" cy="700" r="2.5" fill="#f4b400" />

    <!-- Bottom delicate divider line (Vehicular style) -->
    <line x1="220" y1="940" x2="1700" y2="940" stroke="url(#yellowLineGlow)" stroke-width="1.5" />
    <line x1="220" y1="944" x2="550" y2="944" stroke="#f4b400" stroke-width="0.75" stroke-opacity="0.35" />
    <line x1="1370" y1="944" x2="1700" y2="944" stroke="#f4b400" stroke-width="0.75" stroke-opacity="0.35" />

    <!-- Vertical coordinate lines -->
    <line x1="180" y1="240" x2="180" y2="840" stroke="url(#yellowLineVertical)" stroke-width="0.8" stroke-dasharray="4 6" />
    <line x1="1740" y1="240" x2="1740" y2="840" stroke="url(#yellowLineVertical)" stroke-width="0.8" stroke-dasharray="4 6" />

    <!-- Corner marks -->
    <path d="M 80 80 L 105 80 M 80 80 L 80 105" stroke="#f4b400" stroke-width="1.2" stroke-opacity="0.5" />
    <path d="M 1840 80 L 1815 80 M 1840 80 L 1840 105" stroke="#f4b400" stroke-width="1.2" stroke-opacity="0.5" />
    <path d="M 80 1000 L 105 1000 M 80 1000 L 80 975" stroke="#f4b400" stroke-width="1.2" stroke-opacity="0.5" />
    <path d="M 1840 1000 L 1815 1000 M 1840 1000 L 1840 975" stroke="#f4b400" stroke-width="1.2" stroke-opacity="0.5" />
  </g>
</svg>
