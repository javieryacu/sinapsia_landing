<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base Satin Metallic Bodywork Gradient -->
    <linearGradient id="bodyworkSatin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f4f6f8" />
      <stop offset="35%" stopColor="#ebeef2" />
      <stop offset="70%" stopColor="#e2e6eb" />
      <stop offset="100%" stopColor="#e8ebf0" />
    </linearGradient>

    <!-- Center Specular Ambient Light -->
    <radialGradient id="centerHighlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.9" />
      <stop offset="50%" stopColor="#f4f6f9" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#e2e6eb" stopOpacity="0" />
    </radialGradient>

    <!-- Glowing Horizontal Amber Bus Lines -->
    <linearGradient id="hBusFull" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#f4b400" stopOpacity="0" />
      <stop offset="15%" stopColor="#f4b400" stopOpacity="0.8" />
      <stop offset="50%" stopColor="#e5a918" stopOpacity="0.95" />
      <stop offset="85%" stopColor="#f4b400" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#f4b400" stopOpacity="0" />
    </linearGradient>

    <linearGradient id="hBusLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#f4b400" stopOpacity="0.9" />
      <stop offset="60%" stopColor="#f4b400" stopOpacity="0.7" />
      <stop offset="100%" stopColor="#f4b400" stopOpacity="0" />
    </linearGradient>

    <linearGradient id="hBusRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stopColor="#f4b400" stopOpacity="0.9" />
      <stop offset="60%" stopColor="#f4b400" stopOpacity="0.7" />
      <stop offset="100%" stopColor="#f4b400" stopOpacity="0" />
    </linearGradient>

    <!-- Micro Precision Tech Grid -->
    <pattern id="precisionGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#09090b" stroke-width="0.5" stroke-opacity="0.035" />
      <circle cx="48" cy="0" r="0.7" fill="#f4b400" fill-opacity="0.2" />
    </pattern>
  </defs>

  <!-- 1. Background Layers -->
  <rect width="1920" height="1080" fill="url(#bodyworkSatin)" />
  <rect width="1920" height="1080" fill="url(#centerHighlight)" />
  <rect width="1920" height="1080" fill="url(#precisionGrid)" />

  <!-- 2. Refined Horizontal Architecture Lines (Data Buses & Clean Paths) -->
  <g>
    <!-- Top Horizon Track -->
    <line x1="80" y1="120" x2="1840" y2="120" stroke="url(#hBusFull)" stroke-width="1.2" />
    <line x1="240" y1="124" x2="560" y2="124" stroke="#f4b400" stroke-width="0.75" stroke-opacity="0.4" />
    <line x1="1360" y1="124" x2="1680" y2="124" stroke="#f4b400" stroke-width="0.75" stroke-opacity="0.4" />
    <circle cx="240" cy="120" r="2.5" fill="#f4b400" />
    <circle cx="960" cy="120" r="2.5" fill="#f4b400" />
    <circle cx="1680" cy="120" r="2.5" fill="#f4b400" />

    <!-- Left Side: Sleek Horizontal Stepped Bus Lines (Fade before center text) -->
    <!-- Track L1 -->
    <path d="M 0 280 L 320 280 L 380 340 L 520 340" fill="none" stroke="url(#hBusLeft)" stroke-width="1.4" />
    <circle cx="320" cy="280" r="2.5" fill="#f4b400" />
    <circle cx="520" cy="340" r="3" fill="#f4b400" />
    <line x1="80" y1="276" x2="280" y2="276" stroke="#f4b400" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="4 6" />

    <!-- Track L2 -->
    <path d="M 0 460 L 260 460 L 310 410 L 460 410" fill="none" stroke="url(#hBusLeft)" stroke-width="1.2" stroke-dasharray="6 4" />
    <circle cx="260" cy="460" r="2.5" fill="#f4b400" />
    <circle cx="460" cy="410" r="2.5" fill="#f4b400" />

    <!-- Track L3 -->
    <path d="M 0 640 L 290 640 L 350 700 L 480 700" fill="none" stroke="url(#hBusLeft)" stroke-width="1.4" />
    <circle cx="290" cy="640" r="2.5" fill="#f4b400" />
    <circle cx="480" cy="700" r="3" fill="#f4b400" />

    <!-- Right Side: Sleek Horizontal Stepped Bus Lines (Fade before center text) -->
    <!-- Track R1 -->
    <path d="M 1920 280 L 1600 280 L 1540 340 L 1400 340" fill="none" stroke="url(#hBusRight)" stroke-width="1.4" />
    <circle cx="1600" cy="280" r="2.5" fill="#f4b400" />
    <circle cx="1400" cy="340" r="3" fill="#f4b400" />
    <line x1="1840" y1="276" x2="1640" y2="276" stroke="#f4b400" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="4 6" />

    <!-- Track R2 -->
    <path d="M 1920 460 L 1660 460 L 1610 410 L 1460 410" fill="none" stroke="url(#hBusRight)" stroke-width="1.2" stroke-dasharray="6 4" />
    <circle cx="1660" cy="460" r="2.5" fill="#f4b400" />
    <circle cx="1460" cy="410" r="2.5" fill="#f4b400" />

    <!-- Track R3 -->
    <path d="M 1920 640 L 1630 640 L 1570 700 L 1440 700" fill="none" stroke="url(#hBusRight)" stroke-width="1.4" />
    <circle cx="1630" cy="640" r="2.5" fill="#f4b400" />
    <circle cx="1440" cy="700" r="3" fill="#f4b400" />

    <!-- Bottom Structural Horizon Line -->
    <line x1="100" y1="960" x2="1820" y2="960" stroke="url(#hBusFull)" stroke-width="1.6" />
    <line x1="100" y1="965" x2="420" y2="965" stroke="#f4b400" stroke-width="0.8" stroke-opacity="0.45" />
    <line x1="1500" y1="965" x2="1820" y2="965" stroke="#f4b400" stroke-width="0.8" stroke-opacity="0.45" />
    <circle cx="420" cy="960" r="2.5" fill="#f4b400" />
    <circle cx="1500" cy="960" r="2.5" fill="#f4b400" />

    <!-- Subtle Outer Vertical Guides -->
    <line x1="80" y1="180" x2="80" y2="900" stroke="#f4b400" stroke-opacity="0.2" stroke-width="0.8" stroke-dasharray="6 8" />
    <line x1="1840" y1="180" x2="1840" y2="900" stroke="#f4b400" stroke-opacity="0.2" stroke-width="0.8" stroke-dasharray="6 8" />

    <!-- Precision Corner Framing Marks -->
    <path d="M 40 40 L 70 40 M 40 40 L 40 70" stroke="#f4b400" stroke-width="1.4" stroke-opacity="0.75" />
    <path d="M 1880 40 L 1850 40 M 1880 40 L 1880 70" stroke="#f4b400" stroke-width="1.4" stroke-opacity="0.75" />
    <path d="M 40 1040 L 70 1040 M 40 1040 L 40 1010" stroke="#f4b400" stroke-width="1.4" stroke-opacity="0.75" />
    <path d="M 1880 1040 L 1850 1040 M 1880 1040 L 1880 1010" stroke="#f4b400" stroke-width="1.4" stroke-opacity="0.75" />
  </g>
</svg>
